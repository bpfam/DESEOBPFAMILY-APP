
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>BPFAM | Video Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 30px 12px 22px;
    border-bottom: 1px solid #4a3913;
}

header h1 {
    color: #d9b43c;
    font-size: 32px;
    margin: 0;
    letter-spacing: 2px;
}

header p {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 1px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 20px 10px;
}

h2 {
    color: #d9b43c;
    font-size: 20px;
    margin-bottom: 20px;
}

/* GALLERIA - 3 COLONNE */

.gallery {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-items: start;
}

/* SCHEDA VIDEO */

.video-card {
    background: #111;
    border: 1px solid #53431e;
    border-radius: 12px;
    overflow: hidden;
    min-width: 0;
}

/* VIDEO */

.video-player {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    overflow: hidden;
}

.video-player video,
.video-player iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    object-fit: cover;
}

/* INFORMAZIONI VIDEO */

.video-info {
    padding: 8px 6px;
    text-align: center;
}

.video-info h3 {
    font-size: 11px;
    color: #d9b43c;
    margin: 0 0 5px;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.video-info p {
    color: #aaa;
    font-size: 10px;
    margin: 0;
    overflow-wrap: anywhere;
}

/* MESSAGGI */

.empty {
    color: #aaa;
    text-align: center;
    padding: 25px 10px;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    color: #888;
    padding: 30px;
    font-size: 12px;
}

/* SCHERMI GRANDI - 4 COLONNE */

@media (min-width: 900px) {
    .gallery {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
        gap: 16px;
    }

    .video-player {
        aspect-ratio: 16 / 9;
    }

    .video-info {
        padding: 12px;
    }

    .video-info h3 {
        font-size: 15px;
    }

    .video-info p {
        font-size: 12px;
    }
}

/* TELEFONI MOLTO PICCOLI */

@media (max-width: 340px) {
    .gallery {
        gap: 6px;
    }

    .video-info h3 {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>💎 BPFAM</h1>
    <p>QUALITY • STYLE • RESPECT</p>
</header>

<main>
    <h2>🎬 VIDEO GALLERY</h2>

    <div id="gallery" class="gallery">
        Caricamento video...
    </div>
</main>

<footer>
    BPFAM © 2026
</footer>

<script>
function escapeHTML(value) {
    return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]
    );
}

function videoPlayer(url) {
    if (!url) return "";

    const link = String(url).trim();

    const streamable = link.match(
        /^https:\/\/(?:www\.)?streamable\.com\/(?:e\/)?([a-z0-9]+)\/?(?:\?.*)?$/i
    );

    if (streamable) {
        return `
            <iframe
                src="https://streamable.com/e/${streamable[1]}"
                title="Video"
                loading="lazy"
                allow="fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>
        `;
    }

    if (
        /^https:\/\/[^\s"'<>]+\.mp4(?:\?[^\s"'<>]*)?$/i.test(link)
    ) {
        return `
            <video
                src="${escapeHTML(link)}"
                controls
                playsinline
                preload="metadata">
            </video>
        `;
    }

    return "<p class='empty'>Link video non supportato.</p>";
}

async function loadGallery() {
    const gallery =
        document.getElementById("gallery");

    try {
        const response = await fetch(
            "media.json",
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(
                "Impossibile caricare media.json"
            );
        }

        const videos = await response.json();

        if (!Array.isArray(videos)) {
            throw new Error(
                "Formato JSON non valido"
            );
        }

        gallery.innerHTML = videos.map(item => `
            <article class="video-card">

                <div class="video-player">
                    ${videoPlayer(item.video)}
                </div>

                <div class="video-info">
                    <h3>
                        ${escapeHTML(item.name || "Video")}
                    </h3>

                    <p>
                        ${escapeHTML(item.category || "BPFAM")}
                    </p>
                </div>

            </article>
        `).join("") || `
            <p class="empty">
                Nessun video disponibile.
            </p>
        `;

    } catch (error) {
        console.error(error);

        gallery.innerHTML = `
            <p class="empty">
                Errore nel caricamento dei video.
            </p>
        `;
    }
}

loadGallery();
</script>

</body>
</html>
