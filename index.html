
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DESEO BP FAMILY</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BPFAM">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>

  <!-- SCHERMATA INIZIALE -->
  <div id="splash" class="splash">
    <img src="logo.jpg.PNG" class="splash-logo" alt="BPFAM Logo">
    <p>Quality. Style. Respect.</p>
  </div>

  <main class="app">

    <!-- HOME -->
    <div id="homeView">

      <header class="top-bar">
        <div>
          <p class="small-title">Official Network</p>
          <h1>DESEO BP FAMILY</h1>
        </div>

        <button class="cart-btn" onclick="openSection('carrello')">
          🛒 <span id="cartCount">0</span>
        </button>
      </header>

      <!-- LOGO -->
      <section class="hero">

        <img
          src="logo.jpg.PNG"
          class="logo"
          alt="DESEO BP FAMILY Logo"
        >

      </section>

      <!-- SLOGAN LUXURY -->
      <div class="home-slogan">
        QUALITY • STYLE • RESPECT
      </div>

      <!-- CORONA DECORATIVA -->
      <div class="home-divider">
        ♛
      </div>

      <!-- CINQUE PULSANTI PRINCIPALI -->
      <section class="menu-grid">

        <button
          class="menu-card"
          onclick="openSection('vetrina')"
        >
          <span>🛍️</span>
          <strong>Vetrina</strong>
        </button>

        <button
          class="menu-card"
          onclick="openSection('recensioni')"
        >
          <span>⭐</span>
          <strong>Recensioni</strong>
        </button>

        <button
          class="menu-card"
          onclick="openSection('contatti')"
        >
          <span>📞</span>
          <strong>Contatti</strong>
        </button>

        <button
          class="menu-card"
          onclick="openSection('carrello')"
        >
          <span>🛒</span>
          <strong>Carrello</strong>
        </button>

        <button
          class="menu-card"
          onclick="window.location.href='info/index.html'"
        >
          <span>ℹ️</span>
          <strong>Info</strong>
        </button>

      </section>

      <!-- FOOTER LUXURY -->
      <footer class="home-footer">

        <div class="footer-crown">♛</div>

        <div class="footer-brand">
          DESEO BP FAMILY
        </div>

        <div class="footer-tagline">
          MADE DIFFERENT
        </div>

      </footer>

    </div>

    <!-- SEZIONE APERTA -->
    <div id="sectionView" class="section-view" hidden>

      <header class="section-header">

        <button
          class="back-btn"
          onclick="goHome()"
        >
          ← Home
        </button>

        <button
          class="cart-btn"
          onclick="openSection('carrello')"
        >
          🛒 <span id="sectionCartCount">0</span>
        </button>

      </header>

      <section
        id="content"
        class="content-card section-content"
      >
        <h2>Caricamento...</h2>
      </section>

    </div>

  </main>

  <!-- AGGIORNAMENTO APP -->
  <div id="updateBox" class="update-box">

    <h3>🚀 Nuova versione disponibile</h3>

    <p>
      Aggiorna BPFAM per vedere le ultime modifiche.
    </p>

    <button onclick="updateApp()">
      Aggiorna ora
    </button>

  </div>

  <!-- GALLERIA VIDEO -->
  <a
    href="https://bpfam.github.io/Video-bpfam/"
    class="video-gallery-link"
  >
    🎬 CLICCA QUI PER I VIDEO
  </a>

  <!-- JAVASCRIPT -->
  <script src="app.js"></script>
</body>
</html>
